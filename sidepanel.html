<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikipindai</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" disabled data-i18n-title="back" aria-label="Back">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <form id="searchForm" class="search" role="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button class="go" type="submit" data-i18n-title="search" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <div class="langpick">
      <button id="langBtn" class="langbtn" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="language">
        <img id="langFlag" class="flag" alt="">
        <span id="langCode"></span>
        <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="langMenu" class="langmenu" hidden>
        <div class="langtitle" data-i18n="langMenuTitle"></div>
        <ul id="langList" role="listbox"></ul>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="lookup" class="active" data-i18n="search"></button>
    <button type="button" role="tab" data-tab="history" data-i18n="tabHistory"></button>
    <button type="button" role="tab" data-tab="saved" data-i18n="tabSaved"></button>
    <button type="button" role="tab" data-tab="settings" data-i18n="tabSettings"></button>
  </nav>

  <main id="main">
    <section id="view-lookup">
      <div id="modes" class="modes" role="tablist"></div>
      <div id="content"></div>
    </section>

    <section id="view-history" hidden>
      <div class="toolbar">
        <button type="button" id="clearHistory" class="btn" data-i18n="clearHistory"></button>
      </div>
      <ul id="historyList" class="list"></ul>
      <p id="historyEmpty" class="state" data-i18n="historyEmpty"></p>
    </section>

    <section id="view-saved" hidden>
      <div class="toolbar">
        <button type="button" id="exportSaved" class="btn" data-i18n="export"></button>
        <button type="button" id="importSaved" class="btn" data-i18n="import"></button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="banner help">
        <p data-i18n="savedHelp"></p>
        <pre id="savedSample" class="sample"></pre>
      </div>
      <ul id="savedList" class="list"></ul>
      <p id="savedEmpty" class="state" data-i18n="savedEmpty"></p>
    </section>

    <section id="view-settings" hidden>
      <label class="row">
        <span data-i18n="theme"></span>
        <select id="theme">
          <option value="system" data-i18n="themeSystem"></option>
          <option value="light" data-i18n="themeLight"></option>
          <option value="dark" data-i18n="themeDark"></option>
        </select>
      </label>

      <label class="row check">
        <input type="checkbox" id="saveHistory">
        <span><b data-i18n="saveHistory"></b></span>
      </label>

      <p class="note" data-i18n="privacyNote"></p>
      <p class="note" data-i18n="disclaimer"></p>

      <section class="card tools">
        <h2 class="sec" id="toolsTitle"></h2>
        <ul id="toolsList" class="iwlist"></ul>
      </section>
    </section>
  </main>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
